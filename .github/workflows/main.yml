name: CICD workflow

on: 
  push:
    branches:
        - main
        - dev

  workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest

        strategy:
          fail-fast: true
          matrix:
            std: [17, 20]

        name: Lint with c++ ${{matrix.std}}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install tools
              run: sudo apt-get install -y g++ cppcheck clang-tidy libgtest-dev

            - name: Stylecheck with cppcheck
              run: cppcheck --enable=style,warning,performance --error-exitcode=1 .

            - name: Stylecheck with clang
              run:  clang-tidy main.cpp -checks='bugprone-*,performance-*,readability-*' -warnings-as-errors='*' -- -std=c++${{matrix.std}}

    build:
        needs: lint
        runs-on: ubuntu-latest

        strategy:
          fail-fast: true
          matrix:
            compiler: [g++, clang++]
            std: [17, 20]

        name: Build (${{matrix.compiler}}, C++${{matrix.std}})

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install tools
              run: sudo apt-get install -y g++ cppcheck clang-tidy libgtest-dev

            - name: Build
              run: ${{ matrix.compiler }} -std=c++${{ matrix.std }} main.cpp module1.cpp -o program -Wall -pedantic

            - name: Run module tests
              run: |
                ${{ matrix.compiler }} -std=c++${{ matrix.std }} module1_unittest.cpp module1.cpp -lgtest_main -lgtest -pthread -o module1_tests
                ./module1_tests

            - name: Integration test
              run: |
                OUTPUT=$(./program)
                printf 'Output: %s\n' "$OUTPUT"
                if [ "$OUTPUT" = "Moin" ]; then
                  echo "Test bestanden"
                else
                  echo "Test fehlgeschlagen: '$OUTPUT'"
                  exit 1
                fi

            - name: Run main
              run: ./program  


    deploy:
      needs: build
      runs-on: ubuntu-latest
      permissions:
        contents: write
      
      name: Deploy
      
      steps:
        - name: Checkout repo
          uses: actions/checkout@v7
        - name: Release Build
          run: g++ -std=c++17 main.cpp module1.cpp -o program -O2
        - name: Upload binary
          uses: actions/upload-artifact@v5
          with:
            name: program
            path: program
  #      - name: Run semantic release
   #       uses: 
        - name: Create release page
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v1.0.${{ github.run_number }}
            name: Release v1.0.${{ github.run_number }}
            body: |
              Erster Release mit Unit Tests.
              Binary für Linux (x64).
            files: programm

            

        