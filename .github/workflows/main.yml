name: CICD workflow

on: 
  push:
    branches:
        - main
        - dev

  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: build main
              run: g++ main.cpp module1.cpp -o program -Wall -pedantic
            - name: run
              run: ./program  