name: CICD workflow

on: 
  push:
    branches:
        - main
        - dev

  workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install tools
              run: sudo apt-get install -y g++ cppcheck clang-tidy libgtest-dev

            - name: Stylecheck with cppcheck
              run: cppcheck --enable=style,warning,performance --error-exitcode=1 .

            - name: Stylecheck with clang
              run:  clang-tidy main.cpp -checks='bugprone-*,performance-*,readability-*' -warnings-as-errors='*' -- -std=c++17

    build:
        needs: lint
        runs-on: ubuntu-latest

        strategy:
          fail-fast: true
          matrix:
            compiler: [g++, clang++]
            std: [17, 20]

        name: Build (${{matrix.compiler}}, C++${{matrix.std}})

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install tools
              run: sudo apt-get install -y g++ cppcheck clang-tidy libgtest-dev
              
            - name: Build
              run: (${{ matrix.compiler }}) main.cpp module1.cpp -o program -Wall -pedantic

            - name: Run module tests
              run: |
                g++ -std=c++17 module1_unittest.cpp module1.cpp -lgtest_main -lgtest -pthread -o module1_tests
                ./module1_tests

            - name: Integration test
              run: |
                OUTPUT=$(./program)
                printf 'Output: %s\n' "$OUTPUT"
                if [ "$OUTPUT" = "Moin" ]; then
                  echo "Test bestanden"
                else
                  echo "Test fehlgeschlagen: '$OUTPUT'"
                  exit 1
                fi

            - name: Run main
              run: ./program  