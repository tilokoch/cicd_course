name: py_unittests

on:
    workflow_dispatch:

jobs:
    run_tests:
        runs-on:
            ubuntu-latest

        name: Run Python unittests

        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.12"

            - name: Run tests
              run: python3 -m unittest discover -v

        

